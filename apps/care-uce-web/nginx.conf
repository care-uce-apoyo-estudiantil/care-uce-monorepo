server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo estático cae a index.html
    # (React Router maneja el enrutamiento en el cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets versionados por Vite (hash en el nombre)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
