version: '3.8'

services:
  # 1. Contenedor de Base de Datos para Auth Service
  auth-db:
    image: postgres:15-alpine
    container_name: careuce-auth-db-qa
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - careuce-qa-network
    # No exponemos puertos al exterior, máxima seguridad.

  # 2. EL API GATEWAY (La nueva puerta de enlace)
  api-gateway:
    image: nginx:alpine
    container_name: careuce-api-gateway-qa
    restart: always
    ports:
      - '80:80' # 🔥 ATENCIÓN: Exponemos en el puerto 80 estándar web. ¡Adiós problemas con Cloudflare!
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
    networks:
      - careuce-qa-network

  # 3. Tu Microservicio de Autenticación (Ahora está protegido)
  auth-service:
    image: ${DOCKER_USERNAME}/careuce-auth:qa
    container_name: careuce-auth-service-qa
    restart: always
    # 🔥 ELIMINAMOS "ports: - '3000:3000'". Ya no es accesible desde afuera, solo Nginx puede verlo.
    depends_on:
      - auth-db
    env_file:
      - .env
    networks:
      - careuce-qa-network

networks:
  careuce-qa-network:
    driver: bridge
