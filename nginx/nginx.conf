events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 🔥 NUEVO: Frontend Web (React SPA) servido por el contenedor "web".
        # Esta misma ruta "/" también sirve de health check para el ALB
        # (el contenedor web responde 200 con el index.html).
        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #  ARREGLO: Enrutamiento Transparente (Sin barras al final)
        location /api/auth {
            proxy_pass http://auth-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #  NUEVO: Enrutamiento para Triage Service
        location /api/triage {
            proxy_pass http://triage-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #  NUEVO: Enrutamiento para Clinical Service
        location /api/clinical {
            proxy_pass http://clinical-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #  NUEVO: Enrutamiento para Appointment Service
        location /api/appointments {
            proxy_pass http://appointment-service:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Here more paths for future.
    }
}