name: QA Deployment Pipeline

on:
  push:
    branches:
      - feat/nx-libs

jobs:
  ci-and-build:
    name: 🏗️ Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🐳 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🚀 Build and Push Auth Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/careuce-auth:qa -f apps/backend/auth-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/careuce-auth:qa

      # 🔥 NUEVO: Construir y subir el Triage Service
      - name: 🚀 Build and Push Triage Service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/careuce-triage:qa -f apps/backend/triage-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/careuce-triage:qa

  deploy:
    name: 🚀 Deploy to AWS QA
    needs: ci-and-build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository for Compose file
        uses: actions/checkout@v4

      - name: 🔐 Configurar llave SSH Nativa
        run: |
          mkdir -p ~/.ssh
          # Escribimos la llave respetando los saltos de línea exactos
          cat << 'KEYEOF' > ~/.ssh/aws_key.pem
          ${{ secrets.QA_SSH_PRIVATE_KEY }}
          KEYEOF
          chmod 600 ~/.ssh/aws_key.pem

      - name: 📂 Copiar docker-compose y Nginx a EC2 (Native SCP)
        run: |
          scp -r -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem docker-compose.qa.yml nginx/ ubuntu@${{ secrets.QA_EC2_IP }}:/home/ubuntu/

      - name: 🌐 Ejecutar comandos remotos (Native SSH)
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_key.pem ubuntu@${{ secrets.QA_EC2_IP }} << 'EOF'
          set -e 

          echo "🚀 Conectado exitosamente a la EC2 de AWS QA de forma nativa"

          # 0. Instalar Docker Compose V2 para soportar imágenes modernas
          sudo apt-get update -y
          sudo apt-get install -y docker-compose-v2

          # 1. Inyectar el archivo .env de forma segura
          cat << 'ENVEOF' > /home/ubuntu/.env
          ${{ secrets.QA_ENV_FILE_TEST }}
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          ENVEOF

          # 2. Login en Docker Hub
          echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          # 3. LIMPIEZA PREVIA: Borrar contenedores apagados e imágenes viejas para liberar RAM/Disco
          cd /home/ubuntu

          echo "🛑 Apagando contenedores actuales para liberar sus imágenes..."
          sudo docker compose -f docker-compose.qa.yml down || true

          echo "🗑️ Borrando por completo imágenes y caché viejas..."
          sudo docker system prune -af --volumes

          # 4. Levantar Infraestructura
          cd /home/ubuntu
          sudo docker compose -f docker-compose.qa.yml pull
          sudo docker compose -f docker-compose.qa.yml up -d

          # ⏳ Esperar a que Nginx esté completamente listo antes del reload
          echo "⏳ Esperando a que el contenedor de Nginx inicie por completo..."
          sleep 3

          sudo docker exec careuce-api-gateway-qa nginx -s reload
          EOF
