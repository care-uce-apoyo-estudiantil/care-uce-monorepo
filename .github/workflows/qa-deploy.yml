name: QA Deployment Pipeline

on:
  push:
    branches:
      - qa-pipeline

jobs:
  ci-and-build:
    name: 🏗️ Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🐳 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🚀 Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/careuce-auth:qa -f apps/backend/auth-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/careuce-auth:qa

  deploy:
    name: 🚀 Deploy to AWS QA
    needs: ci-and-build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository for Compose file
        uses: actions/checkout@v4

      # Copiamos el archivo docker-compose.qa.yml al servidor EC2
      - name: 📂 Copy Docker Compose file to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.QA_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.QA_SSH_PRIVATE_KEY }}
          source: 'docker-compose.qa.yml'
          target: '/home/ubuntu/'

      # Entramos por SSH, inyectamos el .env secreto y levantamos los contenedores
      - name: 🌐 Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.QA_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.QA_SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Conectado exitosamente a la EC2 de AWS QA"

            # 1. Crear el archivo .env con los secretos de GitHub
            echo "${{ secrets.QA_ENV_FILE }}" > /home/ubuntu/.env

            # 2. Login en Docker en el servidor (para descargar la imagen)
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 3. Levantar la base de datos y el microservicio usando Docker Compose
            cd /home/ubuntu
            sudo docker-compose -f docker-compose.qa.yml pull
            sudo docker-compose -f docker-compose.qa.yml up -d

            # 4. Limpiar imágenes viejas para no llenar el disco de AWS
            sudo docker image prune -af
