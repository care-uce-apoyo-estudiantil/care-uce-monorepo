name: PROD Deployment Pipeline

on:
  push:
    branches:
      - feat/prod

jobs:
  ci-and-build:
    name: 🏗️ Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🐳 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🚀 Build and Push Docker Image (PROD)
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/careuce-auth:prod -f apps/backend/auth-service/Dockerfile .
          docker push ${{ secrets.DOCKER_USERNAME }}/careuce-auth:prod

  deploy-to-asg:
    name: 🚀 Refresh Auto Scaling Group (PROD)
    needs: ci-and-build
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Crítico para el Learner Lab de AWS Academy
          aws-region: us-east-1

      - name: 🔄 Iniciar Instance Refresh en el ASG de Producción
        run: |
          echo "🔄 Solicitando a AWS Auto Scaling el reemplazo seguro de instancias..."

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name careuce-prod-asg \
            --preferences '{"MinHealthyPercentage": 50}'
            
          echo "✅ AWS ha recibido la orden de actualización progresiva (Zero Downtime)."
