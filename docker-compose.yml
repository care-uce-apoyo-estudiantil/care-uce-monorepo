version: '3.8'
services:
  postgres-auth:
    image: postgres:15-alpine
    container_name: careuce-postgres-auth
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-auth_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  postgres-triage:
    image: postgres:15-alpine
    container_name: careuce-postgres-triage
    environment:
      POSTGRES_USER: ${TRIAGE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TRIAGE_DB_PASSWORD:-root}
      POSTGRES_DB: ${TRIAGE_DB_NAME:-triage_db}
    ports:
      - '5434:5432' # Usamos el 5434 en tu PC para no chocar con el 5433 de auth
    volumes:
      - postgres_triage_data:/var/lib/postgresql/data

  # Añade esto debajo de tus bases de datos actuales (postgres, etc.)
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - '9092:9092'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

volumes:
  postgres_auth_data:
  postgres_triage_data:
